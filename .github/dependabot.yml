version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Dhaka
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Major upgrades need migrations (e.g. Tailwind 4 config, MongoDB 7 vs
    # @auth/mongodb-adapter peer range), so handle them as deliberate PRs.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
